name: poly-collector

on:
  schedule:
    # 每 15 分钟触发一次（UTC 时间，GitHub 的 cron 最小间隔就是 15 分钟）
    - cron: '*/15 * * * *'
  workflow_dispatch:   # 允许手动点按钮运行，方便测试

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 单次最多跑 60 分钟，防止卡死

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install "ccxt>=4.5.76"

      - name: 运行采集脚本
        run: python collect_poly_15m.py --run-for 600 --out poly_data

      - name: 把数据提交回仓库
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add poly_data/
          git commit -m "data $(date -u +%Y%m%d%H%M)" || echo "no changes"
          git push
